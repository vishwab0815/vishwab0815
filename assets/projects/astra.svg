  .heal { transform-box: fill-box; transform-origin: center; opacity: 0; animation: heal 8s infinite; }
  @keyframes heal { 0%, 60% { opacity: 0; transform: scale(1); } 62% { opacity: .9; } 76%, 100% { opacity: 0; transform: scale(3); } }
  .beam { stroke-dasharray: 6 6; animation: beam 8s infinite; }
  @keyframes beam { 0%, 29% { opacity: 0; } 32%, 56% { opacity: 1; stroke-dashoffset: -60; } 60%, 100% { opacity: 0; stroke-dashoffset: -80; } }
  @keyframes log0 { 0%, 17.9% { opacity: 0; transform: translateY(6px); } 21%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes log1 { 0%, 31.9% { opacity: 0; transform: translateY(6px); } 35%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes log2 { 0%, 45.9% { opacity: 0; transform: translateY(6px); } 49%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes log3 { 0%, 59.9% { opacity: 0; transform: translateY(6px); } 63%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  .log0 { animation: log0 8s infinite; }
  .log1 { animation: log1 8s infinite; }
  .log2 { animation: log2 8s infinite; }
  .log3 { animation: log3 8s infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .reveal { clip-path: none !important; } }
</style>
