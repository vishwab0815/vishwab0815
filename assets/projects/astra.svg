  .victim { animation: victim 8s infinite; }
  @keyframes victim { 0%, 17% { stroke: #3FB950; fill: #3FB950; fill-opacity: .15; } 20%, 56% { stroke: #F85149; fill: #F85149; fill-opacity: .3; } 62%, 100% { stroke: #3FB950; fill: #3FB950; fill-opacity: .15; } }
