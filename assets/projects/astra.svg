<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="ASTRA: an alert fires on a Kubernetes pod, the agent finds the root cause, opens a GitOps PR and the pod heals">
