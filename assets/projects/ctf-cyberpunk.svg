<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="CTF-CyberPunk: a neon synthwave grid scrolls toward the viewer while ACCESS GRANTED glitches in cyan and magenta">
<title>CTF-CyberPunk: a neon synthwave grid scrolls toward the viewer while ACCESS GRANTED glitches in cyan and magenta</title>
<style>
  .mono { font-family: ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }

  .floor { animation: floor 3s cubic-bezier(.55,0,1,.45) infinite; }
  @keyframes floor { from { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } to { transform: translateY(102px); opacity: .8; } }
  .gc { animation: gc 3.2s steps(1) infinite; } .gm { animation: gm 3.2s steps(1) infinite; }
  @keyframes gc { 0%, 86% { transform: translate(-2px, 0); } 88% { transform: translate(-9px, 2px); } 90% { transform: translate(6px, -2px); } 92% { transform: translate(-4px, 1px); } 94%, 100% { transform: translate(-2px, 0); } }
  @keyframes gm { 0%, 86% { transform: translate(2px, 0); } 88% { transform: translate(8px, -2px); } 90% { transform: translate(-7px, 2px); } 92% { transform: translate(5px, -1px); } 94%, 100% { transform: translate(2px, 0); } }
  .gw { animation: gw 3.2s steps(1) infinite; }
  @keyframes gw { 0%, 87% { opacity: 1; } 89% { opacity: .35; } 91% { opacity: 1; } 93% { opacity: .6; } 95%, 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .reveal { clip-path: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#1F0B2E"/></linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E6EDF3" opacity=".06"/></pattern>
  <clipPath id="card"><rect width="840" height="240" rx="16"/></clipPath>
<linearGradient id="sun" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E3B341"/><stop offset="1" stop-color="#FF7AC6"/></linearGradient>
  <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0D1117" stop-opacity="0"/><stop offset="1" stop-color="#FF7AC6" stop-opacity=".18"/></linearGradient>
  <mask id="stripes"><rect width="840" height="240" fill="#fff"/><rect x="0" y="96" width="840" height="2" fill="#000"/><rect x="0" y="108" width="840" height="3" fill="#000"/><rect x="0" y="118" width="840" height="4" fill="#000"/><rect x="0" y="127" width="840" height="5" fill="#000"/></mask>
  <clipPath id="cmd"><rect x="40" y="18" width="306.0" height="30">
  <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0.0;10.2;20.4;30.6;40.8;51.0;61.2;71.4;81.6;91.8;102.0;112.2;122.4;132.6;142.8;153.0;163.2;173.4;183.6;193.8;204.0;214.2;224.4;234.6;244.8;255.0;265.2;275.4;285.6;295.8;306.0" keyTimes="0.0000;0.0100;0.0200;0.0300;0.0400;0.0500;0.0600;0.0700;0.0800;0.0900;0.1000;0.1100;0.1200;0.1300;0.1400;0.1500;0.1600;0.1700;0.1800;0.1900;0.2000;0.2100;0.2200;0.2300;0.2400;0.2500;0.2600;0.2700;0.2800;0.2900;0.3000"/>
</rect></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="840" height="240" fill="url(#bg)"/>
<rect width="840" height="240" fill="url(#dots)"/>

<rect width="840" height="138" fill="url(#sky)"/>
<circle cx="420" cy="138" r="70" fill="url(#sun)" mask="url(#stripes)" opacity=".9"/>
<rect y="138" width="840" height="102" fill="#12061C"/>
<line x1="420" y1="138" x2="-380" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="-280" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="-180" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="-80" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="20" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="120" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="220" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="320" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="420" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="520" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="620" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="720" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="820" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="920" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="1020" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="1120" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/><line x1="420" y1="138" x2="1220" y2="240" stroke="#FF7AC6" stroke-opacity=".45" stroke-width="1.5"/>
<line x1="0" x2="840" y1="138" y2="138" stroke="#FF7AC6" stroke-width="1.5" class="floor" style="animation-delay:0.0s"/><line x1="0" x2="840" y1="138" y2="138" stroke="#FF7AC6" stroke-width="1.5" class="floor" style="animation-delay:-0.5s"/><line x1="0" x2="840" y1="138" y2="138" stroke="#FF7AC6" stroke-width="1.5" class="floor" style="animation-delay:-1.0s"/><line x1="0" x2="840" y1="138" y2="138" stroke="#FF7AC6" stroke-width="1.5" class="floor" style="animation-delay:-1.5s"/><line x1="0" x2="840" y1="138" y2="138" stroke="#FF7AC6" stroke-width="1.5" class="floor" style="animation-delay:-2.0s"/><line x1="0" x2="840" y1="138" y2="138" stroke="#FF7AC6" stroke-width="1.5" class="floor" style="animation-delay:-2.5s"/>
<line x1="0" x2="840" y1="138" y2="138" stroke="#FF7AC6" stroke-width="2"/>
<g class="sans" font-size="56" font-weight="900" text-anchor="middle" letter-spacing="3">
  <text x="420" y="116" fill="#39D0D8" opacity=".85" class="gc">ACCESS GRANTED</text>
  <text x="420" y="116" fill="#FF7AC6" opacity=".85" class="gm">ACCESS GRANTED</text>
  <text x="420" y="116" fill="#FFFFFF" class="gw">ACCESS GRANTED</text>
</g>
<text x="40" y="40" class="mono reveal" font-size="17" fill="#3FB950" clip-path="url(#cmd)">root@ctf:~# ./breach --level 7</text>
</g>
<rect x=".5" y=".5" width="839" height="239" rx="16" fill="none" stroke="#30363D"/>
</svg>
