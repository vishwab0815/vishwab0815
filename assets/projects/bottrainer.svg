<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="BotTrainer: spoken audio becomes a waveform, Whisper transcribes it, Llama-3 classifies it, and structured intent JSON appears">
<title>BotTrainer: spoken audio becomes a waveform, Whisper transcribes it, Llama-3 classifies it, and structured intent JSON appears</title>
<style>
  .mono { font-family: ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }

  .eq { transform-box: fill-box; transform-origin: center; animation: eq 1s ease-in-out infinite alternate; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .flow { stroke-dasharray: 4 10; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  @keyframes j0 { 0%, 39.9% { opacity: 0; transform: translateY(6px); } 43%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes j1 { 0%, 47.9% { opacity: 0; transform: translateY(6px); } 51%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes j2 { 0%, 55.9% { opacity: 0; transform: translateY(6px); } 59%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes j3 { 0%, 63.9% { opacity: 0; transform: translateY(6px); } 67%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes j4 { 0%, 69.9% { opacity: 0; transform: translateY(6px); } 73%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  .j0 { animation: j0 8s infinite; } .j1 { animation: j1 8s infinite; } .j2 { animation: j2 8s infinite; } .j3 { animation: j3 8s infinite; } .j4 { animation: j4 8s infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .reveal { clip-path: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#16122A"/></linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E6EDF3" opacity=".06"/></pattern>
  <clipPath id="card"><rect width="840" height="240" rx="16"/></clipPath>
<linearGradient id="wave" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#A371F7"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
  <clipPath id="said"><rect x="110" y="44" width="237.6" height="30">
  <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;0.0;10.8;21.6;32.4;43.2;54.0;64.8;75.6;86.4;97.2;108.0;118.8;129.6;140.4;151.2;162.0;172.8;183.6;194.4;205.2;216.0;226.8;237.6" keyTimes="0;0.0400;0.0527;0.0655;0.0782;0.0909;0.1036;0.1164;0.1291;0.1418;0.1545;0.1673;0.1800;0.1927;0.2055;0.2182;0.2309;0.2436;0.2564;0.2691;0.2818;0.2945;0.3073;0.3200"/>
</rect></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="840" height="240" fill="url(#bg)"/>
<rect width="840" height="240" fill="url(#dots)"/>

<g transform="translate(60 98)" fill="none" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round">
  <rect x="0" y="0" width="24" height="42" rx="12" fill="#E6EDF3" fill-opacity=".12"/>
  <path d="M-8 26 a20 20 0 0 0 40 0 M12 46 v12 M2 58 h20"/>
</g>
<text x="110" y="66" class="mono reveal" font-size="18" fill="#8B949E" clip-path="url(#said)">&quot;book a flight to goa&quot;</text>
