<rect x="261" y="117.05572261940688" width="6" height="25.9" rx="3" fill="url(#wave)" class="eq" style="animation-delay:-0.34s;animation-duration:1.41s"/><rect x="272" y="100.97749348729849" width="6" height="58.0" rx="3" fill="url(#wave)" class="eq" style="animation-delay:-1.13s;animation-duration:1.31s"/><rect x="283" y="117.67031415645033" width="6" height="24.7" rx="3" fill="url(#wave)" class="eq" style="animation-delay:-0.55s;animation-duration:1.22s"/><rect x="294" y="106.01814995519817" width="6" height="48.0" rx="3" fill="url(#wave)" class="eq" style="animation-delay:-0.50s;animation-duration:0.98s"/><rect x="305" y="104.71139565762132" width="6" height="50.6" rx="3" fill="url(#wave)" class="eq" style="animation-delay:-0.55s;animation-duration:0.83s"/><rect x="316" y="100.7492208071053" width="6" height="58.5" rx="3" fill="url(#wave)" class="eq" style="animation-delay:-0.16s;animation-duration:0.82s"/><rect x="327" y="102.62117624748498" width="6" height="54.8" rx="3" fill="url(#wave)" class="eq" style="animation-delay:-0.48s;animation-duration:1.21s"/>
<text x="118" y="214" class="mono" font-size="15" fill="#8B949E">voice or text input</text>
<path d="M352 130 H452" stroke="#A371F7" stroke-width="2.5" class="flow" fill="none"/>
<path d="M448 123 l8 7 -8 7" stroke="#A371F7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="108" class="mono" font-size="15" fill="#8B949E" text-anchor="middle">whisper</text>
<text x="402" y="160" class="mono" font-size="15" fill="#8B949E" text-anchor="middle">llama-3</text>
<rect x="470" y="40" width="340" height="168" rx="12" fill="#010409" fill-opacity=".75" stroke="#30363D"/>
<text x="488" y="76" class="mono j0" font-size="17" fill="#E6EDF3">{</text>
<text x="488" y="104" class="mono j1" font-size="17" fill="#E6EDF3">&#160;&#160;<tspan fill="#58A6FF">"intent"</tspan>: <tspan fill="#3FB950">"book_flight"</tspan>,</text>
<text x="488" y="132" class="mono j2" font-size="17" fill="#E6EDF3">&#160;&#160;<tspan fill="#58A6FF">"entities"</tspan>: {<tspan fill="#58A6FF">"city"</tspan>:"Goa"},</text>
<text x="488" y="160" class="mono j3" font-size="17" fill="#E6EDF3">&#160;&#160;<tspan fill="#58A6FF">"confidence"</tspan>: <tspan fill="#FFA657">0.97</tspan></text>
<text x="488" y="188" class="mono j4" font-size="17" fill="#E6EDF3">}</text>
</g>
<rect x=".5" y=".5" width="839" height="239" rx="16" fill="none" stroke="#30363D"/>
</svg>
