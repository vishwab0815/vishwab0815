<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="PhishGuard: a suspicious URL is typed, SSL, domain age and IP reputation checks fail, and the shield flags it as phishing with a risk score of 94">
<title>PhishGuard: a suspicious URL is typed, SSL, domain age and IP reputation checks fail, and the shield flags it as phishing with a risk score of 94</title>
<style>
  .mono { font-family: ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }

  @keyframes c0 { 0%, 29.9% { opacity: 0; transform: translateY(6px); } 33%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes c1 { 0%, 39.9% { opacity: 0; transform: translateY(6px); } 43%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  @keyframes c2 { 0%, 49.9% { opacity: 0; transform: translateY(6px); } 53%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  .c0 { animation: c0 8s infinite; } .c1 { animation: c1 8s infinite; } .c2 { animation: c2 8s infinite; }
  .shield { animation: shield 8s infinite; }
  @keyframes shield { 0%, 58% { fill: #21262D; } 62%, 92% { fill: #F85149; } 97%, 100% { fill: #21262D; } }
  .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 8s infinite; }
  @keyframes ring { 0%, 60% { opacity: 0; transform: scale(1); } 62% { opacity: .8; } 80%, 100% { opacity: 0; transform: scale(1.5); } }
  @keyframes verdict { 0%, 61.9% { opacity: 0; transform: translateY(6px); } 65%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } } .verdict { animation: verdict 8s infinite; }
  .caret { animation: caret 1s steps(1) infinite; } @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .reveal { clip-path: none !important; } }
</style>
