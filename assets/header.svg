<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Vishwanath B — AIOps Engineer, AI/ML Engineer, Full-Stack Developer, Security Builder">
<title>Vishwanath B — AIOps · AI/ML · Full-Stack · Security</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }

  .role { opacity: 0; animation: role 16s infinite; }
  .role:nth-of-type(2) { animation-delay: 4s; }
  .role:nth-of-type(3) { animation-delay: 8s; }
  .role:nth-of-type(4) { animation-delay: 12s; }
  @keyframes role {
    0% { opacity: 0; transform: translateY(10px); }
    4%, 21% { opacity: 1; transform: translateY(0); }
    25%, 100% { opacity: 0; transform: translateY(-10px); }
  }

  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .line { opacity: 0; animation: line 12s infinite; }
  .l1 { animation-delay: .4s; } .l2 { animation-delay: 1.4s; } .l3 { animation-delay: 2.6s; }
  .l4 { animation-delay: 3.8s; } .l5 { animation-delay: 5.2s; } .l6 { animation-delay: 6.4s; }
  @keyframes line { 0% { opacity: 0; transform: translateX(-6px); } 3%, 80% { opacity: 1; transform: none; } 88%, 100% { opacity: 0; } }

  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.8); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .role:first-of-type, .line { opacity: 1; }
  }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset=".55" stop-color="#0D1424"/><stop offset="1" stop-color="#120F26"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" x2="600" y1="0" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
    <stop offset="0" stop-color="#79C0FF"/><stop offset=".33" stop-color="#A371F7"/><stop offset=".66" stop-color="#58A6FF"/><stop offset="1" stop-color="#79C0FF"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#58A6FF" stop-opacity=".28"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#A371F7" stop-opacity=".24"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#E6EDF3" opacity=".07"/>
  </pattern>
  <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <circle cx="220" cy="60" r="260" fill="url(#glowA)">
    <animate attributeName="cx" values="220;320;220" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="300" r="300" fill="url(#glowB)">
    <animate attributeName="cy" values="300;240;300" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="0" width="1200" height="3" fill="url(#shine)"/>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#30363D"/>

<!-- Left: identity -->
<g class="rise">
  <text x="64" y="88" class="mono" font-size="15" fill="#8B949E">~/vishwab0815 <tspan fill="#3FB950">❯</tspan> <tspan fill="#E6EDF3">whoami</tspan><tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
</g>
<g class="rise" style="animation-delay:.15s">
  <text x="60" y="160" class="sans" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#shine)">Vishwanath B</text>
</g>
<g class="sans" font-size="26" font-weight="600" fill="#E6EDF3">
  <text class="role" x="64" y="206">AIOps Engineer <tspan fill="#8B949E" font-weight="400">· self-healing infrastructure</tspan></text>
  <text class="role" x="64" y="206">AI / ML Engineer <tspan fill="#8B949E" font-weight="400">· LLMs, agents &amp; forecasting</tspan></text>
  <text class="role" x="64" y="206">Full-Stack Developer <tspan fill="#8B949E" font-weight="400">· Next.js, Node &amp; FastAPI</tspan></text>
  <text class="role" x="64" y="206">Security Builder <tspan fill="#8B949E" font-weight="400">· CTFs, phishing &amp; deepfakes</tspan></text>
</g>
<g class="rise sans" style="animation-delay:.35s" font-size="14" fill="#8B949E">
  <circle cx="70" cy="257" r="4" fill="#3FB950"/>
  <circle cx="70" cy="257" r="4" fill="#3FB950" class="pulse"/>
  <text x="84" y="262">Engineering @ VTU, Bengaluru · building in public</text>
</g>
<g class="rise mono" style="animation-delay:.5s" font-size="13">
  <rect x="62" y="282" width="112" height="28" rx="14" fill="#58A6FF" fill-opacity=".12" stroke="#58A6FF" stroke-opacity=".35"/>
  <text x="118" y="300" text-anchor="middle" fill="#79C0FF">kubernetes</text>
  <rect x="184" y="282" width="96" height="28" rx="14" fill="#A371F7" fill-opacity=".12" stroke="#A371F7" stroke-opacity=".35"/>
  <text x="232" y="300" text-anchor="middle" fill="#D2A8FF">langgraph</text>
  <rect x="290" y="282" width="80" height="28" rx="14" fill="#3FB950" fill-opacity=".12" stroke="#3FB950" stroke-opacity=".35"/>
  <text x="330" y="300" text-anchor="middle" fill="#7EE787">next.js</text>
  <rect x="380" y="282" width="64" height="28" rx="14" fill="#F78166" fill-opacity=".12" stroke="#F78166" stroke-opacity=".35"/>
  <text x="412" y="300" text-anchor="middle" fill="#FFA198">rust</text>
</g>

<!-- Right: terminal replaying an ASTRA incident -->
<g class="rise" style="animation-delay:.25s">
  <rect x="700" y="52" width="452" height="236" rx="12" fill="#010409" fill-opacity=".72" stroke="#30363D"/>
  <path d="M700 64a12 12 0 0 1 12-12h428a12 12 0 0 1 12 12v18H700z" fill="#161B22"/>
  <circle cx="722" cy="67" r="5.5" fill="#FF5F57"/><circle cx="740" cy="67" r="5.5" fill="#FEBC2E"/><circle cx="758" cy="67" r="5.5" fill="#28C840"/>
  <text x="926" y="71" text-anchor="middle" class="mono" font-size="12" fill="#8B949E">astra — incident #4127</text>
  <g class="mono" font-size="13" fill="#C9D1D9">
    <text class="line l1" x="720" y="112"><tspan fill="#3FB950">❯</tspan> astra watch --cluster prod</text>
    <text class="line l2" x="720" y="140"><tspan fill="#FF7B72">[ALERT&#160;]</tspan> api-7f9c CrashLoopBackOff</text>
    <text class="line l3" x="720" y="166"><tspan fill="#D2A8FF">[RCA&#160;&#160;&#160;]</tspan> OOMKilled · limit 256Mi</text>
    <text class="line l4" x="720" y="192"><tspan fill="#79C0FF">[PLAN&#160;&#160;]</tspan> memory → 512Mi <tspan fill="#8B949E">conf 0.94</tspan></text>
    <text class="line l5" x="720" y="218"><tspan fill="#FFA657">[GITOPS]</tspan> PR #212 opened · human ✓</text>
    <text class="line l6" x="720" y="244"><tspan fill="#3FB950">[HEALED]</tspan> 3/3 pods ready in 41s</text>
  </g>
  <text x="720" y="272" class="mono" font-size="13" fill="#3FB950">❯<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
